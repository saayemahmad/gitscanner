<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Renewal Blood Network Banner">
  <defs>
    <!-- Primary 3D Crimson Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0712" />
      <stop offset="45%" stop-color="#881337" />
      <stop offset="80%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="glowLeft" cx="18%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="50%" stop-color="#ffe4e6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#4c0519" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- 3D Blood Drop Gradient -->
    <linearGradient id="dropGrad" x1="25%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ff6b81" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="250" rx="18" ry="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Layer -->
    <rect x="0" y="0" width="1200" height="250" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="250" fill="url(#glowLeft)" />
    <rect x="0" y="0" width="1200" height="250" fill="url(#glowRight)" />

    <!-- Subtle Technical Dot Grid -->
    <g fill="#ffffff" fill-opacity="0.06">
      <circle cx="80" cy="40" r="1.5" /><circle cx="140" cy="40" r="1.5" /><circle cx="200" cy="40" r="1.5" />
      <circle cx="260" cy="40" r="1.5" /><circle cx="320" cy="40" r="1.5" /><circle cx="380" cy="40" r="1.5" />
      <circle cx="880" cy="45" r="1.5" /><circle cx="940" cy="45" r="1.5" /><circle cx="1000" cy="45" r="1.5" />
      <circle cx="1060" cy="45" r="1.5" /><circle cx="1120" cy="45" r="1.5" />
      <circle cx="880" cy="95" r="1.5" /><circle cx="940" cy="95" r="1.5" /><circle cx="1000" cy="95" r="1.5" />
      <circle cx="1060" cy="95" r="1.5" /><circle cx="1120" cy="95" r="1.5" />
    </g>

    <!-- Background ECG Heartbeat Pulse Line -->
    <path d="M 0,132 L 560,132 L 585,132 L 600,98 L 615,158 L 630,78 L 648,166 L 664,116 L 678,132 L 1200,132"
          fill="none" stroke="#fecdd3" stroke-opacity="0.16" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Layered 3D Waves -->
    <path d="M 0,185 C 240,145 420,235 720,190 C 960,152 1080,210 1200,178 L 1200,250 L 0,250 Z" fill="url(#wave1)" />
    <path d="M 0,208 C 280,242 520,172 820,215 C 1010,240 1110,192 1200,206 L 1200,250 L 0,250 Z" fill="url(#wave2)" />

    <!-- Left 3D Glass Emblem Container -->
    <g transform="translate(56, 54)">
      <!-- 3D Offset Shadow -->
      <rect x="4" y="6" width="132" height="132" rx="30" fill="#000000" fill-opacity="0.28" />
      <!-- Glass Card -->
      <rect x="0" y="0" width="132" height="132" rx="30" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5" />
      <!-- Inner Highlight Rim -->
      <rect x="3" y="3" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

      <!-- 3D Glossy Blood Drop -->
      <path d="M 66,24 C 66,24 33,64 33,84 C 33,102.2 47.8,116 66,116 C 84.2,116 99,102.2 99,84 C 99,64 66,24 66,24 Z"
            fill="#4c0519" fill-opacity="0.45" transform="translate(2, 4)" />
      <path d="M 66,22 C 66,22 33,62 33,82 C 33,100.2 47.8,114 66,114 C 84.2,114 99,100.2 99,82 C 99,62 66,22 66,22 Z"
            fill="url(#dropGrad)" stroke="#fecdd3" stroke-opacity="0.55" stroke-width="1.5" />
      <!-- Specular 3D Highlight Arc -->
      <path d="M 52,58 C 46,69 44,79 47,91" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="4" stroke-linecap="round" />
      <circle cx="51" cy="99" r="2.5" fill="#ffffff" fill-opacity="0.65" />
      <!-- Medical Cross Accent -->
      <rect x="62.5" y="70" width="7" height="22" rx="2" fill="#ffffff" fill-opacity="0.92" />
      <rect x="55" y="77.5" width="22" height="7" rx="2" fill="#ffffff" fill-opacity="0.92" />
    </g>

    <!-- Main Typography -->
    <g transform="translate(218, 64)">
      <!-- Eyebrow Badge -->
      <rect x="0" y="0" width="298" height="26" rx="13" fill="url(#pillGrad)" stroke="#fda4af" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#4ade80" />
      <text x="27" y="17.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#ffe4e6">
        VOLUNTARY BLOOD BANK NETWORK
      </text>

      <!-- 3D Layered Title -->
      <text x="2" y="73" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#000000" fill-opacity="0.32">
        Renewal Blood Network
      </text>
      <text x="0" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#ffffff">
        Renewal Blood Network
      </text>

      <!-- Subtitle -->
      <text x="0" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#fecdd3">
        Real-Time Donor Discovery  •  Emergency Queue  •  Verified Geo-Map
      </text>
    </g>

    <!-- Right-Side 3D Tech Feature Pills -->
    <g transform="translate(918, 56)">
      <g transform="translate(0, 0)">
        <rect x="2" y="3" width="230" height="36" rx="10" fill="#000000" fill-opacity="0.22" />
        <rect x="0" y="0" width="230" height="36" rx="10" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />
        <circle cx="18" cy="18" r="4.5" fill="#38bdf8" />
        <text x="32" y="22.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">MariaDB / MySQL (InnoDB)</text>
      </g>
      <g transform="translate(0, 48)">
        <rect x="2" y="3" width="230" height="36" rx="10" fill="#000000" fill-opacity="0.22" />
        <rect x="0" y="0" width="230" height="36" rx="10" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />
        <circle cx="18" cy="18" r="4.5" fill="#4ade80" />
        <text x="32" y="22.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">WebSocket Real-Time Sync</text>
      </g>
      <g transform="translate(0, 96)">
        <rect x="2" y="3" width="230" height="36" rx="10" fill="#000000" fill-opacity="0.22" />
        <rect x="0" y="0" width="230" height="36" rx="10" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />
        <circle cx="18" cy="18" r="4.5" fill="#fb923c" />
        <text x="32" y="22.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Turnstile &amp; Google OAuth 2.0</text>
      </g>
    </g>

    <!-- Outer Subtle Border Highlight -->
    <rect x="1" y="1" width="1198" height="248" rx="17" ry="17" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" />
  </g>
</svg>

